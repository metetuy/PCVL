# Publishes a GitHub release when a push to main carries a version that has no
# release yet: bump MARKETING_VERSION (and CURRENT_PROJECT_VERSION), push, and
# v<version> appears with the DMG, the zip and its signature. Pushes that keep
# the version build nothing.
#
# The signing key is the UPDATE_SIGNING_KEY secret of the "release" environment
# (see scripts/update-signer.swift). Only the publish job enters that
# environment, and the environment only admits main, so workflows on other
# branches can't read the key. Required reviewers on it make every release wait
# for approval.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a new version
        id: version
        run: |
          version=$(xcodebuild -project PCVL.xcodeproj -scheme PCVL -configuration Release -showBuildSettings 2>/dev/null \
            | awk '$1 == "MARKETING_VERSION" { print $3; exit }')
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::MARKETING_VERSION \"$version\" isn't a version number like 1.2."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump MARKETING_VERSION to publish a new one."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish v${{ needs.check.outputs.version }}
        env:
          PCVL_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$PCVL_UPDATE_SIGNING_KEY" ]; then
            echo "::error::Add UPDATE_SIGNING_KEY to the release environment's secrets (see scripts/update-signer.swift)."
            exit 1
          fi
          xcodebuild -version
          scripts/release.sh --publish
